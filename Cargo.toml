[package]
name = "knicks"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
jiff = "=0.2.38"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["derive", "mysql", "mysql-rsa", "runtime-tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "=0.7.1", features = ["fs", "set-header"] }
ts-rs = "=12.0.1"
webpki-root-certs = "=1.0.12"
