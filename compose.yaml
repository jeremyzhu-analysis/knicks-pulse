# This project's own MySQL, separate from any server on the machine.
# Host port 3307 leaves 3306 free for a MySQL installed on the machine.
name: knicks

services:
  mysql:
    image: docker.io/library/mysql:9.7.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: knicks
      MYSQL_USER: knicks
      MYSQL_PASSWORD: knicks
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uknicks", "-pknicks"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
